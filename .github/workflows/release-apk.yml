name: Build & Publish HomeList APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      version_code:
        description: 'Android versionCode integer (must increase every release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Android 36.1 platform
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-36.1 platform-tools'

      - name: Accept any remaining Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VER_NAME}" >> "$GITHUB_OUTPUT"

          # Bump versionName and versionCode in app/build.gradle.kts for this build
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ github.event.inputs.version_code }}/" app/build.gradle.kts
          else
            AUTO_CODE=$(( GITHUB_RUN_NUMBER + 1 ))
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${AUTO_CODE}/" app/build.gradle.kts
          fi

      - name: Prepare signing keystore & build APK
        id: build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ensure Secrets Gradle Plugin default file exists on clean checkout
          [ -f .env.example ] || touch .env.example

          GRADLE_CI_FLAGS=(
            --no-daemon
            --no-configuration-cache
            --stacktrace
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            "-Dorg.gradle.workers.max=2"
          )

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease "${GRADLE_CI_FLAGS[@]}"
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            echo "signed_mode=release" >> "$GITHUB_OUTPUT"
          else
            # Fallback signing for initial testing before release keystore secrets are configured
            if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
            elif [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            gradle :app:assembleDebug "${GRADLE_CI_FLAGS[@]}"
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
            echo "signed_mode=debug" >> "$GITHUB_OUTPUT"
          fi

          OUT_APK="HomeList-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_SRC" "$OUT_APK"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HomeList ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk_path }}
          body: |
            HomeList Android update (`${{ steps.build.outputs.signed_mode }}` signed).

            Install on family phones by tapping the `.apk` asset below or automatically via Obtainium pointed at `https://github.com/bobcatchris15-eng/HomeList`.
