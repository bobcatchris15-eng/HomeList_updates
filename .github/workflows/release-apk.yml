name: Build & Publish HomeList APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      version_code:
        description: 'Android versionCode integer (must increase every release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VER_NAME}" >> "$GITHUB_OUTPUT"

          # Bump versionName (and optional versionCode) in app/build.gradle.kts for this build
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ github.event.inputs.version_code }}/" app/build.gradle.kts
          else
            # Use run number + 1 as a monotonically increasing versionCode for tag releases
            AUTO_CODE=$(( GITHUB_RUN_NUMBER + 1 ))
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${AUTO_CODE}/" app/build.gradle.kts
          fi

      - name: Prepare signing keystore & build APK
        id: build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            echo "signed_mode=release" >> "$GITHUB_OUTPUT"
          else
            # Fallback for initial testing before release keystore secrets are added
            if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            fi
            gradle :app:assembleDebug --no-daemon
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
            echo "signed_mode=debug" >> "$GITHUB_OUTPUT"
          fi

          OUT_APK="HomeList-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_SRC" "$OUT_APK"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HomeList ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk_path }}
          body: |
            HomeList Android update (`${{ steps.build.outputs.signed_mode }}` signed).

            Install on family phones by tapping the `.apk` asset below or automatically via Obtainium pointed at `https://github.com/bobcatchris15-eng/HomeList`.
