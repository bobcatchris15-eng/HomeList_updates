name: Build & Publish HomeList APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      version_code:
        description: 'Android versionCode integer (must increase every release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Android 36.1 platform
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platforms;android-36.1 platform-tools'

      - name: Accept any remaining Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Determine release version & patch CI KSP version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VER_NAME}" >> "$GITHUB_OUTPUT"

          # Bump versionName and a globally monotonic versionCode (never resets across repos)
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            FINAL_CODE="${{ github.event.inputs.version_code }}"
          else
            # Monotonic 10-second counter since Nov 2023 (~9.5M+, safe for 600+ years, never resets on repo move)
            FINAL_CODE=$(( ( $(date -u +%s) - 1700000000 ) / 10 ))
          fi
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${FINAL_CODE}/" app/build.gradle.kts
          echo "code=${FINAL_CODE}" >> "$GITHUB_OUTPUT"

          # Upgrade KSP 2.3.5 -> 2.3.14 on GitHub Actions to fix google/ksp#2763
          # (headless CI NullPointerException in ApplicationManager.getApplication())
          sed -i -E 's/googleDevtoolsKsp = "2\.3\.5"/googleDevtoolsKsp = "2.3.14"/' gradle/libs.versions.toml

      - name: Prepare signing keystore & build APK
        id: build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ensure Secrets Gradle Plugin default file exists on clean checkout
          [ -f .env.example ] || touch .env.example

          GRADLE_CI_FLAGS=(
            --no-daemon
            --no-configuration-cache
            --stacktrace
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true -Dfile.encoding=UTF-8"
            "-Dorg.gradle.workers.max=2"
          )

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            CERT_SHA256=$(keytool -list -v -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload | grep -m1 'SHA256:' | awk '{print $2}')
            gradle :app:assembleRelease "${GRADLE_CI_FLAGS[@]}"
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            echo "signed_mode=release" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
            CERT_SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
            gradle :app:assembleDebug "${GRADLE_CI_FLAGS[@]}"
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
            echo "signed_mode=debug-consistent" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No persistent signing keystore found! Commit debug.keystore.base64 OR configure KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets. Refusing to generate a random key that breaks in-place Android updates."
            exit 1
          fi
          echo "cert_sha256=${CERT_SHA256:-unknown}" >> "$GITHUB_OUTPUT"

          OUT_APK="HomeList-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_SRC" "$OUT_APK"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"

          # Package Windows Home Hub with matching release version
          printf '%s\n' "${{ steps.version.outputs.name }}" > windows-hub/VERSION.txt
          OUT_HUB_ZIP="HomeList-Windows-Hub-${{ steps.version.outputs.tag }}.zip"
          zip -r "$OUT_HUB_ZIP" windows-hub -x "windows-hub/homelist-hub-config.json" "windows-hub/homelist-hub-data.json"
          echo "hub_zip_path=${OUT_HUB_ZIP}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HomeList ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.hub_zip_path }}
          body: |
            HomeList release (`${{ steps.build.outputs.signed_mode }}` signed, `versionCode: ${{ steps.version.outputs.code }}`).

            - **Android phones**: Tap the `.apk` asset below to update in place (no uninstall needed once installed with this signing key). Phones auto-check this repository nightly.
            - **Signing SHA-256**: `${{ steps.build.outputs.cert_sha256 }}`
            - **Windows Home Hub (optional)**: Download the `.zip` asset below (or run `Update-HomeListHub.bat`). The Windows Hub also checks this same release URL nightly.
