name: Build & Publish HomeList APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      version_code:
        description: 'Android versionCode integer (must increase every release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-hub:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test and build Windows Hub
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 test --locked --manifest-path windows-hub/rust-hub/Cargo.toml
          cargo +1.100.0 build --locked --release --manifest-path windows-hub/rust-hub/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: homelist-windows-hub
          path: windows-hub/rust-hub/target/release/HomeListHub.exe
          if-no-files-found: error

  build-iroh-android-libs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'ndk;28.2.13676358'
      - name: Build pinned iroh Android libraries
        shell: bash
        run: |
          rustup default 1.100.0
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version 3.5.4 --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-iroh-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: homelist-iroh-android
          path: app/src/main/jniLibs/*/libiroh_ffi.so
          if-no-files-found: error

  build-and-release:
    needs: [build-windows-hub, build-iroh-android-libs]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: homelist-windows-hub
          path: windows-hub

      - uses: actions/download-artifact@v4
        with:
          name: homelist-iroh-android
          path: app/src/main/jniLibs

      - name: Verify Android native libraries
        shell: bash
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libiroh_ffi.so
          test -s app/src/main/jniLibs/armeabi-v7a/libiroh_ffi.so

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Android 36.1 platform
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platforms;android-36.1 platform-tools build-tools;36.0.0'

      - name: Accept any remaining Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Determine release version & patch CI KSP version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VER_NAME}" >> "$GITHUB_OUTPUT"

          # Bump versionName and a globally monotonic versionCode (never resets across repos)
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            FINAL_CODE="${{ github.event.inputs.version_code }}"
          else
            # Monotonic 10-second counter since Nov 2023 (~9.5M+, safe for 600+ years, never resets on repo move)
            FINAL_CODE=$(( ( $(date -u +%s) - 1700000000 ) / 10 ))
          fi
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${FINAL_CODE}/" app/build.gradle.kts
          echo "code=${FINAL_CODE}" >> "$GITHUB_OUTPUT"

          # Upgrade KSP 2.3.5 -> 2.3.14 on GitHub Actions to fix google/ksp#2763
          # (headless CI NullPointerException in ApplicationManager.getApplication())
          sed -i -E 's/googleDevtoolsKsp = "2\.3\.5"/googleDevtoolsKsp = "2.3.14"/' gradle/libs.versions.toml

      - name: Verify Android repository and migration
        run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache --max-workers=2

      - name: Build and verify rotated release APK
        id: build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HOMELIST_SIGNING_LINEAGE_BASE64: ${{ vars.HOMELIST_SIGNING_LINEAGE_BASE64 }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure the release keystore secret}"
          : "${STORE_PASSWORD:?Configure the keystore password secret}"
          : "${KEY_PASSWORD:?Configure the signing key password secret}"
          : "${HOMELIST_SIGNING_LINEAGE_BASE64:?Configure the HomeList signing lineage before releasing}"

          umask 077
          signing_dir="$(mktemp -d)"
          trap 'rm -rf -- "$signing_dir"' EXIT
          export KEYSTORE_PATH="$signing_dir/homelist-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s' "$HOMELIST_SIGNING_LINEAGE_BASE64" | base64 --decode > "$signing_dir/lineage.bin"
          unset KEYSTORE_BASE64 HOMELIST_SIGNING_LINEAGE_BASE64

          gradle :app:assembleRelease -PhomeListRotatedRelease=true \
            --no-daemon --no-configuration-cache --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            "-Dorg.gradle.workers.max=2"

          OUT_APK="HomeList-$RELEASE_TAG.apk"
          CERT_SHA256=$(bash scripts/sign-rotated-apk.sh \
            app/build/outputs/apk/release/app-release.apk "$OUT_APK" "$signing_dir/lineage.bin" \
            054c57c9046885c5d409108649bf00297f5eee27df9fd7e00a6c88134622608e)
          echo "signed_mode=rotated-release" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUT_APK}" >> "$GITHUB_OUTPUT"

          # Package Windows Home Hub with matching release version
          printf '%s\n' "$RELEASE_VERSION" > windows-hub/VERSION.txt
          OUT_HUB_ZIP="HomeList-Windows-Hub-$RELEASE_TAG.zip"
          zip "$OUT_HUB_ZIP" windows-hub/{HomeListHub.exe,HomeListHub.ps1,Start-HomeListHub.bat,Install-AutoStart.bat,Update-HomeListHub.bat,Update-HomeListHub.ps1,README.md,VERSION.txt}
          echo "hub_zip_path=${OUT_HUB_ZIP}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HomeList ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.hub_zip_path }}
          body: |
            HomeList release (`${{ steps.build.outputs.signed_mode }}` signed, `versionCode: ${{ steps.version.outputs.code }}`).

            - **Android phones**: The APK supports updates from the original HomeList CI signer on Android 9 and newer. Phones auto-check this repository nightly.
            - **Signing SHA-256**: `${{ steps.build.outputs.cert_sha256 }}`
            - **Windows Home Hub (optional)**: Download the `.zip` asset below (or run `Update-HomeListHub.bat`). The Windows Hub also checks this same release URL nightly.
